# Temporarily inline; available as a default as of Nov 10.
# yaml-language-server: $schema=https://snapshot.nx.app/nx-cloud/static/schemas/workflow.schema.json
name: Nx Cloud CI

env:
  NX_CLOUD_BUFFER_TASK_COMPLETIONS: 'false'

on:
  pull-requests:
    event: PR
    branches: ['main']
  pushes:
    event: PUSH
    branches: ['main']

ultracache:
  ignore-reads:
    - apps/shop-e2e/test-output/**
  ignore-writes:
    - apps/shop-e2e/test-output/**
  task-exclusions:
    - project: '@org/shop-e2e'
      ignore-reads:
        - apps/shop/dist/**
        - apps/shop/out-tsc/**
        - apps/shop-e2e/out-tsc/**
        - apps/api/dist/**
      ignore-writes:
        - apps/shop-e2e/test-output/**/*.log
        - apps/shop-e2e/dist/.playwright/**/*.log

launch-templates:
  linux-benchmark:
    resource-class: 'vm-agents-4'
    image: 'ubuntu22.04-node20.19-v3'
    init-steps:
      - name: Git Checkout
        uses: 'nrwl/nx-cloud-workflows/main/workflow-steps/checkout/main.yaml'
        env:
          GIT_CHECKOUT_DEPTH: 0
          GIT_FILTER: 'tree:0'
      - name: Restore npm cache
        uses: 'nrwl/nx-cloud-workflows/main/workflow-steps/cache/main.yaml'
        inputs:
          key: '"npm" | package-lock.json'
          paths: '~/.npm'
          base-branch: 'main'
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/main/workflow-steps/install-node-modules/main.yaml'
      - name: Install Playwright
        script: npx playwright install --with-deps chromium

jobs:
  main:
    runs-on: linux-benchmark
    workers:
      small: { count: 1, workload: 20% }
      medium: 4
      large: 7
      main-job-worker:
        cpu: 4
        memory: 15GiB
      scheduling-constraints:
        - targets: ['e2e*']
          cannot-run-with:
            - targets: ['e2e*']
      stop-after: [test]
    steps:
      - name: Run all checks concurrently
        run: |
          pids=()
          npx nx-cloud record -- nx format:check & pids+=($!)
          npx nx-cloud record -- nx sync:check & pids+=($!)
          npx nx validate --no-agents & pids+=($!)
          npx nx affected -t build typecheck lint test e2e-ci & pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
