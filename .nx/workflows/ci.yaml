# yaml-language-server: $schema=https://snapshot.nx.app/nx-cloud/static/schemas/workflow.schema.json
name: Nx Cloud CI

on:
  pull-requests:
    event: PR
    branches: ['main']
  pushes:
    event: PUSH
    branches: ['main']

ultracache:
  ignore-reads:
    - apps/shop-e2e/test-output/**
  ignore-writes:
    - apps/shop-e2e/test-output/**
  task-exclusions:
    - project: '@org/shop-e2e'
      ignore-reads:
        - apps/shop/dist/**
        - apps/shop/out-tsc/**
        - apps/shop-e2e/out-tsc/**
        - apps/api/dist/**
      ignore-writes:
        - apps/shop-e2e/test-output/**/*.log
        - apps/shop-e2e/dist/.playwright/**/*.log

jobs:
  main:
    runs-on: linux-large-js
    workers:
      small: 2 linux-large-js
      medium: 3 linux-large-js
      large: 5 linux-large-js
      main-job-worker:
        cpu: 4
        memory: 15GiB
      scheduling-constraints:
        - targets: ['e2e*']
          cannot-run-with:
            - targets: ['e2e*']
      stop-after: [test]
    steps:
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run all checks concurrently
        run: |
          pids=()
          npx nx-cloud record -- nx format:check & pids+=($!)
          npx nx-cloud record -- nx sync:check & pids+=($!)
          npx nx validate --no-agents & pids+=($!)
          npx nx affected -t build typecheck lint test e2e-ci & pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
